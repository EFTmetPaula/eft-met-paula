<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Pagina niet gevonden - EFT met Paula</title>
    <link rel="stylesheet" href="/fontawesome-subset.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/a11y.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#4d6a66">
    <style>
        .container { box-sizing: border-box; max-width: 100%; }
        .notfound-logo { display: block; width: 200px; max-width: 60%; height: auto; margin: 20px auto; }
        .notfound { background: var(--primary-color, #4d6a66); color: #fff; padding: 30px; border-radius: 10px; margin-bottom: 30px; text-align: center; }
        .notfound h1 { color: #fff; margin-top: 0; }
        .notfound p { font-size: 1.1em; line-height: 1.6; }
        .back-button { display: inline-block; margin-top: 15px; padding: 14px 28px; background: #fff; color: #4d6a66; font-weight: bold; text-decoration: none; border-radius: 30px; font-size: 1.1em; }
        .back-button:hover, .back-button:focus-visible { background: #d4e8e4; }
        .back-button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
</head>
<body style="background-color: #4d6a66; margin: 0; padding: 0;">
    <main class="container">
        <img src="/logo/logo-avatar-zonderbg.png" alt="EFT met Paula" class="notfound-logo">
        <div class="notfound">
            <h1>Deze pagina bestaat niet (meer)</h1>
            <p>Misschien is het adres verkeerd getypt. Geen zorgen, je kunt gewoon verder in de app.</p>
            <a href="/" class="back-button"><i class="fas fa-home" aria-hidden="true"></i> Terug naar de app</a>
        </div>
    </main>
</body>
</html>
