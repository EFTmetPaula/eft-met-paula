<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Opstartzin - Karatepunt</title>
    <link rel="stylesheet" href="/fontawesome-subset.css">
    <style>
        :root {
            --primary-color: #4d6a66;
            --secondary-color: #4d6a66;
            --text-color: #2c3e50;
            --accent-color: #4d6a66;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--secondary-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            flex-grow: 1;
        }

        .card {
            background: var(--primary-color);
            border: 2px solid white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(77, 106, 102, 0.1);
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.2em;
        }

        .video-container {
            text-align: center;
            margin: 20px 0;
        }

        .tapping-image {
            max-width: 200px;
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .instruction-text {
            text-align: center;
            color: white;
            margin: 15px 0;
            font-size: 1.1em;
            font-style: italic;
        }

        .affirmation {
            font-style: italic;
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: var(--primary-color);
            border: 2px solid white;
            border-radius: 8px;
            color: white;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
        }

        .control-button {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            border: 3px solid white;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .control-button:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 6px 12px rgba(77, 106, 102, 0.3);
        }

        .navigation-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .nav-button {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .nav-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            color: white;
        }

        .nav-button i {
            font-size: 1.2em;
            color: white;
        }

        .nav-button span {
            white-space: nowrap;
            color: white;
        }

        .navigation-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .nav-button.nav-button-home {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-button.nav-button-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .icon-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-top: 30px;
        }
        .icon-button {
            background: var(--primary-color);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7em;
            cursor: pointer;
            transition: all 0.2s;
        }
        .icon-button:hover {
            background: #384d4a;
            color: white;
            transform: scale(1.1);
        }
    </style>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4d6a66">
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EFT Paula">
    <script src="/pwa.js" defer></script>
    <link rel="stylesheet" href="/a11y.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Opstartzin - Karatepunt</h1>
            
            <div class="video-container">
                <div class="tapping-point">
                    <img src="../avatar/karatepunt.jpg?v=3" alt="Karatepunt" class="tapping-image">
                </div>
            </div>

            <div class="instruction-text">
                Klop op het karatepunt en lees hardop mee
            </div>

            <div class="affirmation" id="affirmation">
                "Ook al voel ik mezelf <span id='emotionAffirmation'></span> omdat <span id='situationAffirmation'></span>, toch accepteer ik mezelf precies zoals ik ben."
            </div>

            <div class="icon-row">
                <button class="icon-button" onclick="window.location.href='../eft-tapping.html'" title="Opnieuw beginnen">
                    <i class="fas fa-rotate-right" aria-hidden="true"></i>
                </button>
                <button class="icon-button" id="pausePlayButton" title="Pauze/Play">
                    <i class="fas fa-pause" aria-hidden="true"></i>
                </button>
                <button class="icon-button" onclick="window.location.href='kloppunt-kruin.html'" title="Volgend kloppunt">
                    <i class="fas fa-forward" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="../eft-formatter.js"></script>
    <script src="../eft-speech.js"></script>
    <script>
        // Laad opgeslagen gegevens
        const emotion = sessionStorage.getItem('eftEmotion') || 'deze emotie';
        const situation = sessionStorage.getItem('eftSituation') || 'deze situatie';

        // Zin maken met de gedeelde zinnenmaker (../eft-formatter.js)
        const affirmationText = createAffirmation(emotion, situation, 'setup');
        document.getElementById('affirmation').textContent = affirmationText;

        // Voorlezen na een tik op Start, met pauze en automatisch door (../eft-speech.js)
        EFTSpeech.init({ text: affirmationText, next: 'kloppunt-kruin.html', repeats: 3 });
    </script>
</body>
</html>
